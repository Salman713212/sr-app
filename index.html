var NB={l:[],m:"cash"},DISC=null;
function nbFind(q){

f=ITEMS.filter(function(i){return i.name.toLowerCase().indexOf(q)>-1});return f.length==1?f[0]:null}

nbLines();nbSum()}
function nbAddId(id){
var it=ITEMS.filter(function(i){return i.id==id})[0];if(!it)return;
var x=NB.l.filter(function(l){return l.id==it.id})[0];if(x)x.q+=1;else NB.l.push({id:it.id,n:it.name,q:1,r:LSR[it.id]!=null?LSR[it.id]:""});

function nbSug(){
var q=$("nbi").value.trim().toLowerCase(),r=ITEMS.filter(function(i){return !q||i.name.toLowerCase().indexOf(q)>-1||(i.code||"").toLowerCase().indexOf(q)>-1||(i.barcode||"").indexOf(q)>-1}).slice(0,8);

$("nbm").innerHTML=[["cash","💵 Cash"],["online","📲 Online"],["credit","📒 Udhaar"]].map(function(m){return '<button class="btn'+(NB.m==m[0]?"":" g")+'" style="flex:1" data-a="nbm" data-v="'+m[0]+'">'+m[1]+'</button>'}).join("");

function nbDisc(sub){var s=($("nbd")?$("nbd").value:"").trim(),d=0;if(s.slice(-1)=="%")d=sub*(parseFloat(s)||0)/100;else d=parseFloat(s)||0;return Math.max(0,Math.min(sub,Math.round(d*100)/100))}

async function nbSave(){

catch(e){await api("DELETE","sales?id=eq."+s.id).catch(function(){});throw e}
await load2();billMake(s.id)}catch(e){err(e)}}
async function nbScan(){
if(!("BarcodeDetector" in window))return alert("Is phone/browser mein camera se barcode scan nahi ho sakta. Item ka code likhein, ya barcode scanner istemal karein.");
var st;try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e){return alert("Camera ki ijazat nahi mili.")}
var ov=document.createElement("div");ov.style.cssText="position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column";
ov.innerHTML='<video autoplay playsinline muted style="flex:1;object-fit:cover"></video><button class="btn r" style="margin:14px;padding:14px" id="scx">Band karein</button>';document.body.appendChild(ov);
var v=ov.querySelector("video");v.srcObject=st;var det=new BarcodeDetector(),on=true;
function stop(){on=false;st.getTracks().forEach(function(t){t.stop()});ov.remove()}
ov.querySelector("#scx").onclick=stop;
(async function loop(){while(on){try{var r=await det.detect(v);if(r.length){var c=r[0].rawValue;stop();nbAdd(c);return}}catch(e){}await new Promise(function(k){setTimeout(k,250)})}})()}
